<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Dash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <div class="row row-top">
      <div class="arrow left-arrow">
        <svg id="turn-left" class="signal" viewBox="0 0 48 48">
          <path d="M46.8,17h-10v-7.5S2.2,23.9,2.2,23.9l34.6,14.6v-7.5s10,0,10,0v-14.1Z"/>
          <path d="M37.3,39.3L.9,23.9l36.4-15.2v7.8s10,0,10,0v15.1h-10v7.8ZM3.5,24l32.8,13.8v-7.2s10,0,10,0v-13.1h-10v-7.2S3.5,24,3.5,24Z"/>
        </svg>
      </div>
      <div class="readout readout-speed"><span class="value" id="speed-val">000</span> <label>mph</label></div>
      <div class="readout readout-gps"><span class="value" id="gps-val">0.00000, 0.00000</span></div>
      <div class="arrow right-arrow">
        <svg id="turn-right" class="signal" viewBox="0 0 48 48">
          <path d="M1.3,16.8v14.1h10v7.5l34.6-14.6L11.3,9.4v7.5H1.3Z"/>
          <path d="M10.8,39.4v-7.8H.8v-15.1h10v-7.8l36.4,15.2-36.4,15.4h0ZM11.8,10.2v7.2H1.8v13.1h10v7.2l32.8-13.8L11.8,10.2Z"/>
        </svg></div>
    </div>
    <div class="row">
      <div class="gauge-group">
        <div class="gauge-group-header">
          <span></span>
          <div class="gauge-group-header-icon">
            <span id="fuel-alert" class="alert"></span>
            <svg viewBox="0 0 48 48">
              <path d="M47.36 17.28a2 2 0 0 0 -2.82 0c-3.68 4 -5.54 6.74 -5.54 8.38v15a2 2 0 0 1 -4 0V13.76a5 5 0 0 0 -5 -5h-0.5a0.52 0.52 0 0 1 -0.5 -0.52V4.76A3.5 3.5 0 0 0 25.5 1.24h-22A3.52 3.52 0 0 0 0 4.76v38a3.5 3.5 0 0 0 3.5 3.48h22a3.48 3.48 0 0 0 3.5 -3.48V13.24a0.5 0.5 0 0 1 0.5 -0.48H30a1 1 0 0 1 1 1v27a6 6 0 0 0 12 0v-4.46a0.5 0.5 0 0 1 0.28 -0.46l2 -1.02a3 3 0 0 0 1.66 -2.68v-2.38a3 3 0 0 0 -3 -3h-0.52a0.5 0.5 0 0 1 -0.5 -0.5V26a26.94 26.94 0 0 1 4.48 -5.82 2 2 0 0 0 -0.04 -2.9Zm-25.86 14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h2a1.02 1.02 0 0 1 1 1Zm2 -17.5a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h16a1.02 1.02 0 0 1 1 1Z"></path>
            </svg>
          </div>
          <span></span>
        </div>
        <div class="gauge-group-body">
          <div class="gauge">
            <div id="tps-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>100%</span>
              <span></span>
              <span></span>
              <span></span>
              <span>0%</span>
            </div>
          </div>
          <div class="gauge">
            <div id="fuel-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>F</span>
              <span></span>
              <span>½</span>
              <span></span>
              <span>E</span>
            </div>
          </div>
          <div class="gauge">
            <div id="afr-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>18</span>
              <span>17</span>
              <span>16</span>
              <span>15</span>
              <span>14</span>
              <span>13</span>
              <span>12</span>
              <span>11</span>
            </div>
          </div>
        </div>
        <div class="gauge-group-footer">
          <label>TPS</label>
          <label>Fuel</label>
          <label>AFR</label>
        </div>
      </div>

      <div class="gauge-group">
        <div class="readout-group readout-rpm">
          <div class="readout"><span class="value" id="rpm-val">0000</span></div>
          <label>x100r/min</label>
        </div>
        <div class="readout readout-tach"></div>
        <div class="gauge-group-footer"><label>Tach</label></div>
      </div>

      <div class="gauge-group">
        <div class="gauge-group-header">
          <div class="gauge-group-header-icon">
            <span id="coolant-alert" class="alert"></span>
            <svg viewBox="0 0 48 48">
              <path d="M15.8,36.4v-3.7c-7,3.4-6.3-3.9-15.8-.5v3.7c9.7-3.9,8.5,3.7,15.8.5Z"/>
              <path d="M32.2,32.7v3.7c7.3,3.4,6.1-4.4,15.8-.3v-3.9c-9.5-3.4-8.9,3.9-15.8.5Z"/>
              <path d="M38.4,42h0c-1.7,1-2.4.9-4.1-.2-1.2-.9-2.7-1.4-4.3-1.4s-3,.6-4.2,1.6c-1.5,1.2-2.2,1.2-3.9,0-1.2-1-2.7-1.6-4.2-1.6s-3.1.5-4.3,1.4c-1.7,1.2-2.4,1.4-4.1.2-1.9-1.4-4.4-1.8-6.6-1h-.2v3.9c.7-.5,1.6-.7,2.4-.7s1.7.3,2.4.9c1.1.9,2.5,1.3,3.9,1.3s2.8-.5,3.9-1.3c1.9-1.2,2.7-1.4,4.6,0,1.1.9,2.5,1.4,4,1.4s2.9-.5,4-1.4c1.9-1.4,2.7-1.2,4.6,0,3.1,1.7,5.1,1.9,8,0,.7-.5,1.5-.8,2.4-.8s1.7.2,2.4.6v-3.9c-2.2-.8-4.7-.4-6.6,1h-.1Z"/>
              <path d="M23.6,38.9h.1c1.4,0,2.8-.7,3.7-1.7.9-1,1.4-2.5,1.2-3.8-.2-1.3-1-2.6-2.2-3.4v-3.6h10.6v-3.2h-10.6v-4.4h10.6v-3.2h-10.6v-4.4h10.6v-3.2h-10.6v-3.6c0-.7-.2-1.5-.7-2s-1.2-.9-2-.9-1.4.3-2,.9c-.6.6-.8,1.3-.7,2v25.5c-1.2.7-2,2-2.2,3.4s.2,2.8,1.1,3.9,2.3,1.7,3.7,1.7Z"/>
            </svg>
          </div>
          
          <div class="gauge-group-header-icon">
            <span id="oil-pressure-alert" class="alert"></span>
            <svg viewBox="0 0 40.5 26">
              <path d="M37.6,15c.6-.6.6-1.5,0-2.1l-3-3c-.4-.4-.9-.5-1.4-.4l-8.4,1.7c-.2,0-.5,0-.6-.3l-.7-1.7c-.7-1.6-2.2-2.7-4-2.7h-3.5c-.3,0-.5-.2-.5-.5v-1.5c0-.3.2-.5.5-.5h1.5c1.1,0,2-.9,2-2s-.9-2-2-2h-8c-1.1,0-2,.9-2,2s.9,2,2,2h1.5c.3,0,.5.2.5.5v1.5c0,.3-.2.5-.5.5H2.9c-1.6,0-2.8,1.3-2.9,2.9v7.3c0,2.6,2.1,4.8,4.8,4.8h16.1c2,0,4-.7,5.5-2.1l6.7-6c.2-.2.5-.2.7,0l1.6,1.7c.6.6,1.6.6,2.2,0,0,0,0,0,0,0Z"/>
              <path d="M38.2,18.3c-.2-.2-.4-.3-.7-.3-.3,0-.6,0-.8.3-1.2,1.3-2,2.9-2.2,4.7,0,1.7,1.4,3,3.1,3,1.6,0,2.9-1.4,2.9-3-.2-1.8-1-3.4-2.3-4.7Z"/>
            </svg>
          </div>

          <div class="gauge-group-header-icon">
            <span id="battery-alert" class="alert"></span>
            <svg viewBox="0 0 48 48" >
              <path d="M45 13h-42A3 3 0 0 0 0 16v24a3 3 0 0 0 3 3h42A3 3 0 0 0 48 40V16a3 3 0 0 0 -3 -3ZM15.5 30h-8a2 2 0 0 1 0 -4h8a2 2 0 0 1 0 4Zm25 0h-1.5a0.5 0.5 0 0 0 -0.5 0.5V32a2 2 0 0 1 -4 0v-1.5A0.5 0.5 0 0 0 34 30h-1.5a2 2 0 0 1 0 -4H34a0.5 0.5 0 0 0 0.5 -0.5V24a2 2 0 0 1 4 0v1.5a0.5 0.5 0 0 0 0.5 0.5h1.5a2 2 0 0 1 0 4Z"></path>
              <path d="M7.5 11h8a1 1 0 0 0 1 -1V7a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2V10a1 1 0 0 0 1 1Z"></path>
              <path d="M32.5 11h8a1 1 0 0 0 1 -1V7a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2V10a1 1 0 0 0 1 1Z"></path>
            </svg>
          </div>
        </div>
        <div class="gauge-group-body">
          <div class="gauge">
            <div id="coolant-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>270º</span>
              <span></span>
              <span>120º</span>
            </div>
          </div>
          <div class="gauge">
            <div id="oil-pressure-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>90</span>
              <span>45</span>
              <span>0</span>
            </div>
          </div>
          <div class="gauge">
            <div id="battery-pips" class="gauge-pips">
              <span></span>
              <span></span>
              <span></span> 
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="gauge-legend">
              <span>16</span>
              <span>14</span>
              <span>12</span>
              <span>10</span>
            </div>
          </div>
        </div>
        <div class="gauge-group-footer">
          <label>ºF</label>
          <label>lb/in<sup>2</sup></label>
          <label>V</label>
        </div>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
