<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Dash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <div class="row row-top">
      <div class="arrow left-arrow"><span id="turn-left"></span></div>
      <div class="readout readout-speed"><span id="speed-val">000</span> <label>mph</label></div>
      <div class="readout readout-gps"><span id="gps-val">0.00000, 0.00000</span></div>
      <div class="arrow right-arrow"><span id="turn-right"></span></div>
    </div>

    <div class="row">
      <div class="gauge-group">
        <div class="gauge-group-header"></div>
        <div class="gauge-group-body">
          <div class="gauge"><span id="tps-val">0.0</span> %</div>
          <div class="gauge"><span id="fuel-val">0.0</span> %</div>
          <div class="gauge"><span id="afr-val">0.00</span></div>
        </div>
        <div class="gauge-group-footer">
          <label>TPS</label>
          <label>Fuel</label>
          <label>AFR</label>
        </div>
      </div>

      <div class="gauge-group">
        <div class="readout-group"><span id="rpm-val">0000</span></div>
        <div class="readout-group"></div>
        <div class="gauge-group-footer"><label>Tach</label></div>
      </div>

      <div class="gauge-group">
        <div class="gauge-group-header"></div>
        <div class="gauge-group-body">
          <div class="gauge"><span id="coolant-val">0.0</span></div>
          <div class="gauge"><span id="oil-pressure-val">0.0</span></div>
          <div class="gauge"><span id="battery-val">0.0</span></div>
        </div>
        <div class="gauge-group-footer">
          <label>ºF</label>
          <label>lb/in<sup>2</sup></label>
          <label>V</label>
        </div>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
